spring.application.name=certification-consumer
spring.main.web-application-type=none

spring.datasource.url=jdbc:postgresql://localhost:5432/plataforma_cursos
spring.datasource.username=plataforma_cursos_app
spring.datasource.password=${PLATAFORMA_CURSOS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.acknowledge-mode=manual